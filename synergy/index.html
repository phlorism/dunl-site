<!doctype html>
<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>SYNERGY™ — Employee Engagement Suite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230B0E14'/%3E%3Crect x='1' y='1' width='6' height='2' fill='%233DF06A'/%3E%3Crect x='1' y='4' width='4' height='1' fill='%233DF06A'/%3E%3C/svg%3E">
<style>
:root{
  --void:#0B0E14; --panel:#151B26; --panel2:#1D2635; --edge:#39465C; --edge2:#0A0D13;
  --ink:#DCE6F5; --dim:#7F91AC; --grn:#3DF06A; --grnD:#1B7A38; --amb:#FFB627;
  --red:#FF4D3D; --blu:#4D8DF0; --mag:#FF5FD2; --manila:#C9A227;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
html,body{min-height:100%;background:var(--void)}
body{font-family:var(--mono);color:var(--ink);-webkit-font-smoothing:none;
  touch-action:manipulation;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* CRT */
#crt{position:fixed;inset:0;pointer-events:none;z-index:99}
#crt::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply}
#crt::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%)}
/* chunky window frame */
.win{background:var(--panel);border:3px solid var(--edge);
  box-shadow:0 0 0 3px var(--edge2),4px 4px 0 rgba(0,0,0,.5),inset 2px 2px 0 rgba(255,255,255,.07)}
header{position:relative;z-index:2;display:flex;align-items:center;gap:8px;
  background:var(--panel);border-bottom:3px solid var(--edge);
  padding:calc(7px + env(safe-area-inset-top,0px)) 10px 7px;
  box-shadow:0 3px 0 var(--edge2)}
#logoS{width:26px;height:26px;background:var(--grnD);border:2px solid var(--grn);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:0 0 8px rgba(61,240,106,.4)}
.hspace{flex:1}
.chip{border:2px solid var(--edge);background:var(--void);padding:3px 6px;display:flex;
  align-items:center;gap:5px;white-space:nowrap}
.iconbtn{width:30px;height:30px;border:2px solid var(--edge);background:var(--panel2);
  cursor:pointer;color:var(--ink);font-family:var(--mono);font-size:13px;font-weight:700;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.08),2px 2px 0 rgba(0,0,0,.5);flex:0 0 auto}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
main{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:10px 8px calc(8px + env(safe-area-inset-bottom,0px))}
#hud{padding:9px 10px}
.hudtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#asgnum{margin-bottom:3px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:stretch}
.stat{background:var(--void);border:2px solid var(--edge);padding:4px 7px;min-width:76px}
.stat .k{margin-bottom:3px}
.objs{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.obj{display:flex;align-items:center;gap:5px;background:var(--void);border:2px solid var(--edge);
  padding:3px 7px 3px 3px}
.obj.done{border-color:var(--grn);background:#0E2418}
.obj.bump{animation:bump .25s steps(3)}
@keyframes bump{50%{transform:translateY(-3px)}}
.oi{width:32px;height:32px;flex:0 0 auto;background-size:contain;background-repeat:no-repeat;
  background-position:center;image-rendering:pixelated}
.oi.tapeI{background:repeating-linear-gradient(45deg,#C3402F 0 4px,#E8D5B0 4px 8px);
  border:1px solid var(--edge2)}
.oi.scoreI{background:var(--grnD);border:1px solid var(--grn)}
#boardHost{margin-top:9px;padding:8px}
#boardWrap{position:relative;margin:0 auto;background:#0E1219;
  box-shadow:inset 0 0 0 2px #070A0F;touch-action:none;user-select:none;-webkit-user-select:none}
#tileLayer,#tapeLayer,#fxLayer{position:absolute;inset:0}
#tapeLayer{pointer-events:none;z-index:5}
#fxLayer{pointer-events:none;z-index:8;display:flex;flex-direction:column;align-items:center;
  padding-top:8px;gap:4px}
.tile{position:absolute;top:0;left:0;cursor:pointer;transition:transform .13s steps(4);
  will-change:transform;z-index:1}
.tile .face{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.15),inset -2px -2px 0 rgba(0,0,0,.45)}
.t0 .face{background-color:#5C4230}.t1 .face{background-color:#6B5A18}
.t2 .face{background-color:#1E4A78}.t3 .face{background-color:#4A2E70}
.t4 .face{background-color:#1C5A38}.t5 .face{background-color:#7A2A28}
.tile.sel{z-index:3}
.tile.sel .face{box-shadow:inset 0 0 0 3px var(--grn),inset 2px 2px 0 rgba(255,255,255,.15)}
.tile.hint .face{animation:hintP .6s steps(2) infinite}
@keyframes hintP{50%{box-shadow:inset 0 0 0 3px var(--amb),inset 2px 2px 0 rgba(255,255,255,.15)}}
.tile.pop{z-index:4}
.tile.pop .face{animation:popA .22s steps(4) forwards}
@keyframes popA{40%{transform:scale(1.2)}100%{transform:scale(.2);opacity:0}}
.tile.flash .face{animation:flashA .3s steps(3)}
@keyframes flashA{35%{filter:brightness(2.6) saturate(.4)}}
.tile.s-row .face::before,.tile.s-col .face::before{content:'';position:absolute;inset:0;
  z-index:1;mix-blend-mode:screen}
.tile.s-row .face::before{background:repeating-linear-gradient(0deg,
  rgba(255,255,255,.75) 0 3px,transparent 3px 9px)}
.tile.s-col .face::before{background:repeating-linear-gradient(90deg,
  rgba(255,255,255,.75) 0 3px,transparent 3px 9px)}
.tile.s-bomb .face{animation:bombP .5s steps(2) infinite}
@keyframes bombP{50%{box-shadow:inset 0 0 0 3px var(--red),inset 2px 2px 0 rgba(255,255,255,.15)}}
.tile.s-color .face{background-color:#0D1017;animation:reorgP .48s steps(6) infinite}
@keyframes reorgP{from{background-position-x:var(--sprx,2px)}
  to{background-position-x:calc(var(--sprx,2px) - 6 * var(--sprw,64px))}}
.tile.s-color .face{background-position-x:var(--sprx,2px);background-position-y:center}
.tape{position:absolute;border:3px solid transparent;
  border-image:repeating-linear-gradient(45deg,#C3402F 0 5px,#E8D5B0 5px 10px) 6;
  background:rgba(195,64,47,.14);z-index:5;pointer-events:none}
.tape.lv2{background:rgba(160,26,16,.34);box-shadow:inset 0 0 0 3px rgba(255,77,61,.5)}
.tape.rip{animation:ripA .26s steps(4) forwards}
@keyframes ripA{to{transform:scale(1.4) rotate(12deg);opacity:0}}
.toast{background:var(--void);border:2px solid var(--grn);color:var(--grn);padding:3px 8px;
  animation:toastA 1.4s steps(8) forwards;max-width:94%;box-shadow:3px 3px 0 rgba(0,0,0,.6)}
@keyframes toastA{0%{opacity:0;transform:translateY(6px)}14%{opacity:1;transform:none}
  76%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.float{position:absolute;z-index:7;pointer-events:none;animation:floatA .85s steps(8) forwards}
@keyframes floatA{to{transform:translateY(-32px);opacity:0}}
#banner{position:absolute;inset:0;display:grid;place-items:center;z-index:9;text-align:center;
  background:rgba(11,14,20,.9);padding:14px}
#bannerS{color:var(--dim);font-size:11px;margin-top:7px;line-height:1.6}
.hidden{display:none!important}
#ticker{position:relative;z-index:1;margin-top:8px;border:2px solid var(--edge);
  background:var(--void);overflow:hidden;height:22px;display:flex;align-items:center}
#tickerIn{display:flex;white-space:nowrap;animation:tick 64s linear infinite;flex:0 0 auto}
#tickerIn span{padding-right:34px;color:var(--amb);font-size:10.5px;letter-spacing:.04em}
@keyframes tick{to{transform:translateX(-50%)}}
#ticker:hover #tickerIn{animation-play-state:paused}
.legal{text-align:center;color:#4A5769;font-size:9.5px;margin-top:8px;line-height:1.8}
/* modal / JRPG windows */
#overlay{position:fixed;inset:0;background:rgba(4,6,10,.82);z-index:60;display:grid;
  place-items:center;padding:12px}
#modal{max-width:460px;width:100%;max-height:94vh;overflow:auto;
  animation:mIn .2s steps(4)}
@keyframes mIn{from{transform:scale(.9);opacity:0}}
.mhead{background:var(--edge);padding:4px 8px;display:flex;justify-content:space-between;
  align-items:center;gap:8px}
.mbody{padding:12px}
.memo{background:#E8D5B0;border:3px solid #6B5A2E;padding:11px;color:#241C08;
  box-shadow:inset -3px -3px 0 rgba(107,90,46,.35)}
.memo hr{border:0;border-top:2px dashed #8A7440;margin:8px 0}
.memo .mrow{font-size:11px;line-height:1.85;color:#3B3117}
.memo .mbod{font-size:12.5px;line-height:1.75;margin-top:8px;color:#1A1405}
.memo .ps{font-size:11px;line-height:1.7;margin-top:9px;color:#5A4A20;border-top:2px solid #B49A5E;padding-top:7px}
.memo ul{margin:6px 0 2px 15px;font-size:11.5px;line-height:1.9}
.btnrow{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px 12px;flex-wrap:wrap}
.btn{background:var(--panel2);border:2px solid var(--edge);color:var(--ink);cursor:pointer;
  padding:8px 12px;font-family:var(--mono);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.09),3px 3px 0 rgba(0,0,0,.55)}
.btn:hover{background:var(--edge)}
.btn:active{transform:translate(3px,3px);box-shadow:inset 2px 2px 0 rgba(255,255,255,.09)}
.btn.go{background:var(--grnD);border-color:var(--grn)}
.btn.go:hover{background:#26A64D}
.btn.bad{background:#6B1F19;border-color:var(--red)}
.btn:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.stampwrap{text-align:center;padding:16px 12px 4px}
.stamp{display:inline-block;border:4px solid var(--grn);padding:7px 12px;transform:rotate(-5deg);
  animation:stampIn .3s steps(4);box-shadow:0 0 14px rgba(61,240,106,.35)}
.stamp.red{border-color:var(--red);box-shadow:0 0 14px rgba(255,77,61,.35)}
.stamp.blu{border-color:var(--blu);box-shadow:0 0 14px rgba(77,141,240,.35)}
@keyframes stampIn{0%{transform:rotate(-5deg) scale(2.4);opacity:0}
  60%{transform:rotate(-5deg) scale(.92);opacity:1}}
.sub{color:var(--dim);text-align:center;font-size:11.5px;padding:9px 16px 0;line-height:1.75}
.statsrow{display:flex;gap:6px;justify-content:center;padding:12px 12px 0;flex-wrap:wrap}
.rules{padding:2px 6px 8px;font-size:11.5px;line-height:1.9;list-style:none}
.rules li{margin-bottom:5px;padding-left:13px;position:relative}
.rules li::before{content:'>';position:absolute;left:0;color:var(--grn)}
/* dialogue */
.dlgtop{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 0}
.portrait{width:72px;height:72px;flex:0 0 auto;border:3px solid var(--edge);
  background:#0E1219;box-shadow:inset 0 0 0 2px var(--edge2)}
.nameplate{flex:1;min-width:0}
.dlgbox{margin:10px 12px 0;background:#0D111A;border:3px solid var(--edge);padding:9px 10px;
  min-height:74px;font-size:12px;line-height:1.75;position:relative;
  box-shadow:inset 2px 2px 0 rgba(0,0,0,.6)}
.dlgbox.you{border-color:var(--grnD)}
.arrow{position:absolute;right:6px;bottom:4px;color:var(--grn);animation:ar .5s steps(2) infinite}
@keyframes ar{50%{opacity:0}}
.opts{display:flex;flex-direction:column;gap:6px;padding:10px 12px 0}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--edge);color:var(--ink);
  cursor:pointer;padding:7px 9px;font-family:var(--mono);font-size:11.5px;line-height:1.5;
  box-shadow:2px 2px 0 rgba(0,0,0,.5);display:flex;gap:7px;align-items:flex-start}
.opt:hover{background:var(--edge);border-color:var(--grn)}
.opt:active{transform:translate(2px,2px);box-shadow:none}
.opt .cur{color:var(--grn);flex:0 0 auto}
.opt.coward:hover{border-color:var(--dim)}
.hrline{margin:10px 12px 0;border:2px solid var(--red);background:#1A0B0A;color:var(--red);
  font-size:10.5px;line-height:1.65;padding:7px 9px}
.candorpop{text-align:center;padding:9px 12px 0;color:var(--grn);font-size:11px}
/* boot */
#boot{position:fixed;inset:0;background:var(--void);z-index:90;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 22px;
  font-size:12px;line-height:1.85;color:var(--grn);overflow:hidden;cursor:pointer;
  text-shadow:0 0 6px rgba(61,240,106,.55)}
#bootTxt{white-space:pre-wrap;max-width:560px;margin:0 auto}
#bootTxt .d{color:var(--dim)}#bootTxt .r{color:var(--red)}#bootTxt .a{color:var(--amb)}
.cursorblk{display:inline-block;width:7px;height:12px;background:var(--grn);
  animation:ar .5s steps(2) infinite;vertical-align:-1px}
.cf{position:fixed;top:-12px;width:8px;height:8px;z-index:70;pointer-events:none;
  animation:cfF linear forwards}
@keyframes cfF{to{transform:translateY(106vh)}}
@media(max-width:420px){main{padding:8px 5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{
  animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important}#tickerIn{animation:none}}
</style>
</head>

/* ---------------- 5x7 bitmap font (7 bytes/glyph, 5 significant bits) ------ */
const FONT={

'_':'0000000000001F','=':'00001F001F0000','%':'191A04080B1300','&':'0C12140819120D',
'"':'0A0A0000000000',';':'00040400040408','$':'041E141C05161C','@':'0E111517100E00',
'[':'0E08080808080E',']':'0E02020202020E','×':'00110A040A1100','~':'0000081512 0000'.replace(/ /g,'')
};
const GW=5,GH=7;
function glyphRows(ch){
  const h=FONT[ch]||FONT['?'];
  const out=[];
  for(let i=0;i<GH;i++)out.push(parseInt(h.substr(i*2,2),16));
  return out;
}
/* Renders text to a fresh canvas at integer scale. Uppercase only, by design. */
function pxCanvas(text,scale,color,shadow){
  text=String(text).toUpperCase();
  const s=scale||3, pad=shadow?s:0;
  const w=Math.max(1,text.length*(GW+1)*s-s)+pad, h=GH*s+pad;
  const cv=document.createElement('canvas');
  cv.width=w;cv.height=h;
  cv.style.width=w+'px';cv.style.height=h+'px';
  const g=cv.getContext('2d');
  const draw=(ox,oy,col)=>{
    g.fillStyle=col;
    for(let i=0;i<text.length;i++){
      const rows=glyphRows(text[i]),bx=ox+i*(GW+1)*s;
      for(let r=0;r<GH;r++){
        const bits=rows[r];if(!bits)continue;
        for(let c=0;c<GW;c++){
          if(bits&(1<<(GW-1-c)))g.fillRect(bx+c*s,oy+r*s,s,s);
        }
      }
    }
  };
  if(shadow)draw(s,s,shadow);
  draw(0,0,color||'#DCE6F5');
  return cv;
}
function setPx(el,text,scale,color,shadow){
  if(!el)return;
  el.innerHTML='';
  el.appendChild(pxCanvas(text,scale,color,shadow));
}
function hydrate(root){
  const list=(root.querySelectorAll?root.querySelectorAll('[data-px]'):[])||[];
  for(let i=0;i<list.length;i++){
    const el=list[i];
    setPx(el,el.dataset.px||'',+(el.dataset.s||3),el.dataset.c||'#DCE6F5',el.dataset.sh||null);
  }
}

function drawSprite(g,def,scale,ox,oy,palOv){
  const p=palOv||def.p,d=def.d;
  for(let r=0;r<d.length;r++){
    const row=d[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c];if(ch==='.')continue;
      const col=p[ch]||PAL_K;
      g.fillStyle=col;
      g.fillRect(ox+c*scale,oy+r*scale,scale,scale);
    }
  }
}
const _sc={};
/* Tile sprite at exact integer scale. Color bomb returns a 6-frame sheet. */
function spriteURL(name,scale){
  const k=name+'|'+scale;
  if(_sc[k])return _sc[k];
  const cv=document.createElement('canvas');
  const def=SPR[name];
  if(name==='REORG'){
    cv.width=16*scale*6;cv.height=16*scale;
    const g=cv.getContext('2d');
    for(let f=0;f<6;f++){
      const p={k:'#05070B'};
      for(let i=1;i<=4;i++)p[i]=REORG_CYC[(f+i-1)%6];
      drawSprite(g,def,scale,f*16*scale,0,p);
    }
  }else{
    cv.width=16*scale;cv.height=16*scale;
    drawSprite(cv.getContext('2d'),def,scale,0,0);
  }
  return _sc[k]=cv.toDataURL();
}

const SHIRT=['#4D8DF0','#3DD46E','#FF5FD2','#C9922B','#8A8A8A','#B04A2A','#6B4FA8','#2A6E8A'];
function buildPortrait(seed){
  const rng=mulberry32((seed*2246822519)>>>0);
  const rows=P_BASE.slice();
  const patch=set=>set.forEach(p=>{rows[p[0]]=p[1]});
  patch(P_HAIR[(rng()*P_HAIR.length)|0]);
  patch(P_BROW[(rng()*P_BROW.length)|0]);
  patch(P_MOUTH[(rng()*P_MOUTH.length)|0]);
  patch(P_ACC[(rng()*P_ACC.length)|0]);
  const hair=HAIRC[(rng()*HAIRC.length)|0];
  const si=(rng()*SKIN.length)|0;
  return{d:rows,p:{k:'#080B10',s:SKIN[si],n:SHADE[si],h:hair,b:hair,
    E:'#0A0D13',m:'#9A4040',c:SHIRT[(rng()*SHIRT.length)|0],
    G:'#161E2A',H:'#2A3547',L:'#B04A2A',B:'#E8D5B0'}};
}
function portraitURL(seed,scale){
  const k='P'+seed+'|'+scale;
  if(_sc[k])return _sc[k];
  const def=buildPortrait(seed);
  const cv=document.createElement('canvas');
  cv.width=24*scale;cv.height=24*scale;
  drawSprite(cv.getContext('2d'),def,scale,0,0);
  return _sc[k]=cv.toDataURL();
}

  return((t^(t>>>14))>>>0)/4294967296}}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;
  const t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------------- chiptune audio (pulse + noise, no samples) --------------- */
let AC=null,NOISE=null;
function initAudio(){
  try{
    if(!AC){
      AC=new(window.AudioContext||window.webkitAudioContext)();
      const len=AC.sampleRate*.5;
      NOISE=AC.createBuffer(1,len,AC.sampleRate);
      const d=NOISE.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
/* duty-cycle pulse wave, the actual sound of 1991 */
const _pw={};
function pulse(duty){
  if(!AC)return null;
  const k='d'+duty;
  if(_pw[k])return _pw[k];
  const n=32,real=new Float32Array(n),imag=new Float32Array(n);
  for(let i=1;i<n;i++)imag[i]=(2/(i*Math.PI))*Math.sin(Math.PI*i*duty);
  return _pw[k]=AC.createPeriodicWave(real,imag);
}
function blip(f,d,o){
  if(!AC||!S.sound)return;
  o=o||{};
  try{
    const osc=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(o.at||0);
    if(o.type)osc.type=o.type;else osc.setPeriodicWave(pulse(o.duty||.5));
    osc.frequency.setValueAtTime(f,t);
    if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+d);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.g||.07,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    osc.connect(g);g.connect(AC.destination);osc.start(t);osc.stop(t+d+.02);
  }catch(e){}
}
function noise(d,o){
  if(!AC||!S.sound||!NOISE)return;
  o=o||{};
  try{
    const src=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),
      t=AC.currentTime+(o.at||0);
    src.buffer=NOISE;f.type=o.hp?'highpass':'lowpass';f.frequency.value=o.freq||2200;
    g.gain.setValueAtTime(o.g||.05,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t);src.stop(t+d+.02);
  }catch(e){}
}

/* ---------------- persistence --------------------------------------------- */
/* Uses the artifact storage API. Swap these three for your own store if you
   self-host this file. */
/* Persistence backend, picked once: the artifact storage API when running
   inside Claude; localStorage when self-hosted (dunl.app etc); memory as the
   floor. One file works everywhere. */
const SAVEK='synergy_save_v2';
let _mem=null,_backend=null;
function backend(){
  if(_backend)return _backend;
  try{if(window.storage&&window.storage.get&&window.storage.set)return _backend='cloud'}catch(e){}
  try{if(typeof localStorage!=='undefined'){
    localStorage.setItem(SAVEK+'_t','1');localStorage.removeItem(SAVEK+'_t');
    return _backend='local';
  }}catch(e){}
  return _backend='mem';
}
async function loadSave(){
  const bk=backend();
  try{
    if(bk==='cloud'){
      const r=await window.storage.get(SAVEK);
      if(r&&r.value)return JSON.parse(r.value);
    }else if(bk==='local'){
      const r=localStorage.getItem(SAVEK);
      if(r)return JSON.parse(r);
    }
  }catch(e){}
  return _mem;
}
async function persist(){
  const v={level:S.saveLevel,sound:S.sound,candor:S.candor,incidents:S.incidents,waiver:S.waiver};
  _mem=v;
  const bk=backend();
  try{
    if(bk==='cloud')await window.storage.set(SAVEK,JSON.stringify(v));
    else if(bk==='local')localStorage.setItem(SAVEK,JSON.stringify(v));
  }catch(e){}
}
async function wipeSave(){
  _mem=null;
  const bk=backend();
  try{
    if(bk==='cloud')await window.storage.delete(SAVEK);
    else if(bk==='local')localStorage.removeItem(SAVEK);
  }catch(e){}
}

const pxPos=i=>i*(CELL+GAP);
function layout(){
  const avail=Math.min((boardHost.clientWidth||420)-18,540);
  /* Sprites are 16px source drawn at an INTEGER scale so pixels stay crisp.
     Pick the largest scale that fits, then let the cell hug the sprite. */
  let ps=4;
  while(ps>2&&(16*ps)*N+GAP*(N-1)>avail)ps--;
  const maxCell=Math.floor((avail-GAP*(N-1))/N);
  CELL=Math.min(16*ps+4,Math.max(16*ps,maxCell));
  PS=ps;
  const size=CELL*N+GAP*(N-1);
  boardWrap.style.width=size+'px';boardWrap.style.height=size+'px';
  const ds=document.documentElement.style;
  if(ds.setProperty){
    ds.setProperty('--cell',CELL+'px');
    ds.setProperty('--sprw',(16*PS)+'px');
    ds.setProperty('--sprx',((CELL-16*PS)/2)+'px');
  }
  if(S.grid){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const t=S.grid[r][c];
      if(t){t.el.style.width=CELL+'px';t.el.style.height=CELL+'px';
        updateTileVisual(t);positionTile(t)}
    }
    renderTape();
  }
}
function updateTileVisual(t){
  t.el.className='tile'+(t.t!=null?' t'+t.t:'')+(t.s?' s-'+t.s:'');
  const f=t.face;
  if(t.s==='color'){
    f.style.backgroundImage='url('+spriteURL('REORG',PS)+')';
    f.style.backgroundSize=(16*PS*6)+'px '+(16*PS)+'px';
  }else{
    f.style.backgroundImage='url('+spriteURL(TILES[t.t].s,PS)+')';
    f.style.backgroundSize=(16*PS)+'px '+(16*PS)+'px';
  }
}

/* ---------------- match engine -------------------------------------------- */
function findRuns(){
  const runs=[];
  for(let r=0;r<N;r++){
    let c=0;
    while(c<N){
      const t=S.grid[r][c]?S.grid[r][c].t:null;
      if(t==null){c++;continue}
      let e=c;
      while(e+1<N&&S.grid[r][e+1]&&S.grid[r][e+1].t===t)e++;
      if(e-c+1>=3){const cells=[];for(let i=c;i<=e;i++)cells.push(key(r,i));
        runs.push({cells:cells,dir:'h',t:t})}
      c=e+1;
    }
  }
  for(let c=0;c<N;c++){
    let r=0;
    while(r<N){
      const t=S.grid[r][c]?S.grid[r][c].t:null;
      if(t==null){r++;continue}
      let e=r;
      while(e+1<N&&S.grid[e+1][c]&&S.grid[e+1][c].t===t)e++;
      if(e-r+1>=3){const cells=[];for(let i=r;i<=e;i++)cells.push(key(i,c));
        runs.push({cells:cells,dir:'v',t:t})}
      r=e+1;
    }
  }
  return runs;
}
function findGroups(runs){
  const parent=runs.map((_,i)=>i);
  const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x};
  const cellMap={};
  runs.forEach((run,i)=>{
    run.cells.forEach(k=>{
      if(cellMap[k]!==undefined){
        const a=find(cellMap[k]),b=find(i);
        if(a!==b)parent[a]=b;
      }else cellMap[k]=i;
    });
  });
  const groups={};
  runs.forEach((run,i)=>{
    const root=find(i);
    if(!groups[root])groups[root]={cells:new Set(),runs:[],t:run.t};
    run.cells.forEach(k=>groups[root].cells.add(k));
    groups[root].runs.push(run);
  });
  return Object.keys(groups).map(k=>groups[k]);
}
function planSpawn(g,swapKeys){
  const runs=g.runs;
  const five=runs.filter(r=>r.cells.length>=5)[0];
  const hasH=runs.some(r=>r.dir==='h'),hasV=runs.some(r=>r.dir==='v');
  const four=runs.filter(r=>r.cells.length===4)[0];
  let s=null;
  if(five)s='color';
  else if(hasH&&hasV)s='bomb';
  else if(four)s=(four.dir==='h'?'row':'col');
  if(!s)return null;
  let cell=null;
  if(swapKeys)for(let i=0;i<swapKeys.length;i++){
    if(g.cells.has(swapKeys[i])){cell=swapKeys[i];break}
  }
  if(cell==null){
    const src=five||four||runs[0];
    cell=src.cells[(src.cells.length/2)|0];
  }
  return {cell:cell,s:s,t:g.t};
}
function mostCommonType(){
  const cnt={};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const t=S.grid[r][c];
    if(t&&t.t!=null)cnt[t.t]=(cnt[t.t]||0)+1;
  }
  let best=0,bv=-1;
  for(const k in cnt)if(cnt[k]>bv){bv=cnt[k];best=+k}
  return best;
}
function expandClears(seed){
  const out=new Set(),q=[];
  seed.forEach(k=>q.push(k));
  while(q.length){
    const k=q.pop();
    if(out.has(k))continue;
    out.add(k);
    const t=at(k);
    if(!t||!t.s)continue;
    const add=[],r=kr(k),c=kc(k);
    if(t.s==='row')for(let i=0;i<N;i++)add.push(key(r,i));
    else if(t.s==='col')for(let i=0;i<N;i++)add.push(key(i,c));
    else if(t.s==='bomb'){
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        const rr=r+dr,cc=c+dc;
        if(rr>=0&&rr<N&&cc>=0&&cc<N)add.push(key(rr,cc));
      }
    }else if(t.s==='color'){
      const tt=mostCommonType();
      for(let rr=0;rr<N;rr++)for(let cc=0;cc<N;cc++){
        const o=S.grid[rr][cc];
        if(o&&o.t===tt)add.push(key(rr,cc));
      }
    }
    for(let i=0;i<add.length;i++)if(!out.has(add[i]))q.push(add[i]);
  }
  return out;
}
async function popTiles(clear,cascade){
  const mult=Math.min(cascade||1,6);
  let pts=0,n=0,boom=false;
  clear.forEach(k=>{
    const t=at(k);
    if(!t)return;
    if(t.s)boom=true;
    if(t.t!=null)S.collected[t.t]=(S.collected[t.t]||0)+1;
    t.el.classList.add('pop');
    pts+=10*mult;n++;
    const r=kr(k),c=kc(k);
    if(S.tape&&S.tape[r][c]>0){S.tape[r][c]--;S.tapeCut++;ripTape(r,c)}
  });
  if(!n)return;
  S.score+=pts;
  sfxPop(n);
  if(boom)sfxBoom();
  updateHUD();
  await wait(190);
}
function clearAndRemove(clear){
  clear.forEach(k=>{
    const t=at(k);
    if(t){t.el.remove();S.grid[kr(k)][kc(k)]=null}
  });
}
async function settleBoard(){
  const moved=[];
  for(let c=0;c<N;c++){
    let write=N-1;
    for(let r=N-1;r>=0;r--){
      const t=S.grid[r][c];
      if(t){
        if(write!==r){S.grid[write][c]=t;S.grid[r][c]=null;t.r=write;moved.push(t)}
        write--;
      }
    }
    let above=1;
    for(let r=write;r>=0;r--){
      const t=newTile(r,c,(Math.random()*S.cfg.types)|0);
      t.el.style.transitionDuration='0ms';
      t.el.style.transform='translate('+pxPos(c)+'px,'+pxPos(-above)+'px)';
      void t.el.offsetWidth;
      t.el.style.transitionDuration='';
      S.grid[r][c]=t;moved.push(t);above++;
    }
  }
  for(let i=0;i<moved.length;i++)positionTile(moved[i],true);
  if(moved.length)await wait(175);
}
async function resolve(swapKeys){
  let cascade=0;
  for(let guard=0;guard<40;guard++){
    const runs=findRuns();
    if(!runs.length)break;
    cascade++;
    S.maxCascade=Math.max(S.maxCascade,cascade);
    const groups=findGroups(runs);
    const spawns=[];
    groups.forEach(g=>{const sp=planSpawn(g,swapKeys);if(sp)spawns.push(sp)});
    const seed=new Set();
    groups.forEach(g=>g.cells.forEach(k=>seed.add(k)));
    spawns.forEach(sp=>seed.delete(sp.cell));
    const clear=expandClears(seed);
    spawns.forEach(sp=>clear.delete(sp.cell));
    await popTiles(clear,cascade);
    clearAndRemove(clear);
    spawns.forEach(sp=>{
      const t=at(sp.cell);
      if(!t)return;
      t.s=sp.s;
      if(sp.s==='color')t.t=null;
      updateTileVisual(t);
      const nm=sp.s==='color'?'THE RE-ORG':sp.s==='bomb'?'REPLY ALL':'THE SHREDDER';
      floatText(t.r,t.c,nm,'#3DF06A');
    });
    if(cascade>=2)toast(CASCADE[Math.min(cascade-1,CASCADE.length-1)],'#FFB627');
    else if(Math.random()<.42)toast(pick(TOASTS));
    await settleBoard();
    swapKeys=null;
  }
  return cascade;
}
function comboType(a,b){
  if(!a.s&&!b.s)return null;
  if(a.s==='color'&&b.s==='color')return 'CC';
  if(a.s==='color'||b.s==='color'){
    const other=(a.s==='color')?b:a;
    return other.s?'CS':'C';
  }
  if(a.s&&b.s){
    const line=x=>(x==='row'||x==='col');
    if(line(a.s)&&line(b.s))return 'SS';
    if(a.s==='bomb'&&b.s==='bomb')return 'BB';
    return 'SB';
  }
  return null;
}
const COMBO_NAME={CC:'THE GREAT RESET',C:'COMPANY-WIDE RE-ORG',CS:'TOTAL RESTRUCTURE',
  SS:'CROSS-FUNCTIONAL',BB:'REPLY-ALL STORM',SB:'ESCALATED'};
async function executeCombo(type,A,B){
  const seed=new Set();
  const inb=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
  if(type==='CC'){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)seed.add(key(r,c));
  }else if(type==='C'||type==='CS'){
    const other=(A.s==='color')?B:A,colorT=(A.s==='color')?A:B;
    let tt=other.t;
    if(tt==null)tt=mostCommonType();
    const conv=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const t=S.grid[r][c];
      if(t&&t.t===tt&&t!==colorT)conv.push(t);
    }
    const sp=(type==='CS')?other.s:null;
    conv.forEach((t,i)=>{
      t.s=(sp==='bomb')?'bomb':(sp?(i%2?'col':'row'):(i%2?'col':'row'));
      updateTileVisual(t);
    });
    await wait(280);
    conv.forEach(t=>seed.add(key(t.r,t.c)));
    seed.add(key(colorT.r,colorT.c));
  }else if(type==='SS'){
    for(let i=0;i<N;i++){seed.add(key(B.r,i));seed.add(key(i,B.c))}
  }else if(type==='BB'){
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)
      if(inb(B.r+dr,B.c+dc))seed.add(key(B.r+dr,B.c+dc));
  }else if(type==='SB'){
    for(let d=-1;d<=1;d++){
      if(B.r+d>=0&&B.r+d<N)for(let i=0;i<N;i++)seed.add(key(B.r+d,i));
      if(B.c+d>=0&&B.c+d<N)for(let i=0;i<N;i++)seed.add(key(i,B.c+d));
    }
  }
  A.s=null;B.s=null;
  if(A.t==null)A.t=(Math.random()*S.cfg.types)|0;
  if(B.t==null)B.t=(Math.random()*S.cfg.types)|0;
  seed.add(key(A.r,A.c));seed.add(key(B.r,B.c));
  return expandClears(seed);
}

async function animateSwap(A,B){
  const ar=A.r,ac=A.c,br=B.r,bc=B.c;
  S.grid[ar][ac]=B;S.grid[br][bc]=A;
  A.r=br;A.c=bc;B.r=ar;B.c=ac;
  positionTile(A,true);positionTile(B,true);
  sfxSwap();
  await wait(140);
}
async function trySwap(a,b){
  if(S.busy||S.modal)return;
  const A=S.grid[a.r][a.c],B=S.grid[b.r][b.c];
  if(!A||!B)return;
  S.busy=true;stopHint();clearSel();
  await animateSwap(A,B);
  const ct=comboType(A,B);
  if(ct){
    S.moves--;
    const clear=await executeCombo(ct,A,B);
    toast(COMBO_NAME[ct],'#FF5FD2');
    sfxSting();
    await popTiles(clear,2);
    clearAndRemove(clear);
    await settleBoard();
    await resolve(null);
    await endTurn();
    return;
  }
  if(!findRuns().length){
    sfxDeny();
    await animateSwap(A,B);
    S.busy=false;startHint();
    return;
  }
  S.moves--;
  await resolve([key(A.r,A.c),key(B.r,B.c)]);
  await endTurn();
}
function findHint(){
  const dirs=[[0,1],[1,0]];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    for(let d=0;d<2;d++){
      const r2=r+dirs[d][0],c2=c+dirs[d][1];
      if(r2>=N||c2>=N)continue;
      const A=S.grid[r][c],B=S.grid[r2][c2];
      if(!A||!B)continue;
      if(comboType(A,B))return [A,B];
      S.grid[r][c]=B;S.grid[r2][c2]=A;
      const ok=findRuns().length>0;
      S.grid[r][c]=A;S.grid[r2][c2]=B;
      if(ok)return [A,B];
    }
  }
  return null;
}
let hintT=null,hintEls=[];
function startHint(){

    const h=findHint();
    if(h){h.forEach(t=>{t.el.classList.add('hint');hintEls.push(t)})}
    if(Math.random()<.5)toast(pick(IDLE),'#FFB627');

}
function stopHint(){
  if(hintT)clearTimeout(hintT);

  hintEls.forEach(t=>t.el.classList.remove('hint'));
  hintEls=[];
}
async function ensureMoves(){
  let guard=0;
  while(!findHint()&&guard++<12){
    toast('RESTRUCTURING IN PROGRESS','#FF4D3D');
    const tiles=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.grid[r][c])tiles.push(S.grid[r][c]);
    const types=tiles.filter(t=>t.t!=null).map(t=>t.t);
    shuf(types);

    tiles.forEach(t=>{if(t.t!=null){t.t=types[i++];updateTileVisual(t)}});

/* iOS zoom killers. Safari ignores parts of the viewport meta, so block the
   gestures directly: pinch via Apple's gesture events, double-tap by eating
   the second touchend inside 350ms. The second tap is re-dispatched as a
   click so fast UI mashing (dialogue skipping, tile taps) still lands. */
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});

document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-_lastTE<350){
    e.preventDefault();

    if(t&&t.isConnected&&typeof t.click==='function')t.click();
  }

/* ---------------- level generation ---------------------------------------- */
function shufR(r,a){
  for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
const genName=rng=>pickR(rng,ADJ)+' '+pickR(rng,NOUN)+' '+pickR(rng,EVT);
/* Red tape is the only positionally-constrained objective -- you must match ON
   a taped square -- so its size is the real difficulty dial. Pick an exact
   layer target from the level, paint a pattern, then trim/pad to hit it. */
function genTape(rng,level){
  const g=[];
  for(let r=0;r<N;r++)g.push(new Array(N).fill(0));
  if(level<4)return {g:g,total:0};
  const target=Math.max(6,Math.min(18,4+level));
  const pat=(rng()*4)|0;
  const put=(r,c)=>{if(r>=0&&r<N&&c>=0&&c<N)g[r][c]=1};
  if(pat===0){const r0=2+((rng()*4)|0);for(let c=0;c<N;c++){put(r0,c);put(r0+1,c)}}
  else if(pat===1){for(let i=2;i<N-2;i++){put(2,i);put(N-3,i);put(i,2);put(i,N-3)}}
  else if(pat===2){const r0=(rng()*(N-4))|0,c0=(rng()*(N-4))|0;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)put(r0+r,c0+c)}
  else{[[1,1],[1,N-3],[N-3,1],[N-3,N-3]].forEach(o=>{
    for(let r=0;r<2;r++)for(let c=0;c<2;c++)put(o[0]+r,o[1]+c)})}
  let cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c])cells.push([r,c]);
  shufR(rng,cells);
  while(cells.length>target){const x=cells.pop();g[x[0]][x[1]]=0}
  while(cells.length<target){
    const r=(rng()*N)|0,c=(rng()*N)|0;
    if(!g[r][c]){g[r][c]=1;cells.push([r,c])}
  }
  if(level>=13)for(const x of cells)if(rng()<0.3)g[x[0]][x[1]]=2;
  let total=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)total+=g[r][c];
  return {g:g,total:total};
}
/* Objectives are derived FROM the move budget, not the raw level number.
   E = tiles the level is expected to clear (measured: ~5.6/move with cascades);
   a given type is ~E/types of that. Needs are a fraction of that share, so a
   level can never ask for more than it hands you. Difficulty ramps by stacking
   objective KINDS, not by inflating a single number into the impossible. */
function levelConfig(level){
  const rng=mulberry32((level*2654435761)>>>0);
  const types=level>=7?6:5;
  let moves=Math.round(28+Math.min(level,12)*0.9)+((rng()*7)|0);
  moves=Math.max(24,Math.min(44,moves));
  const tape=genTape(rng,level);
  const nC=level<3?1:(level<9?2:(rng()<.35?3:2));
  const wantScore=(level>=6&&rng()<.4);
  const E=moves*5.6, perType=E/types;
  let f=0.56+0.19*Math.min(1,level/16);
  if(nC>=3)f*=0.84;
  if(tape.total>0)f*=0.92;
  if(wantScore)f*=0.95;
  const objectives=[],pool=shufR(rng,[0,1,2,3,4,5].slice(0,types));
  for(let i=0;i<nC;i++){
    let need=Math.round(perType*f)+(((rng()*5)|0)-2);
    objectives.push({kind:'collect',t:pool[i],need:Math.max(8,Math.min(34,need))});
  }
  if(tape.total>0)objectives.push({kind:'tape',need:tape.total});
  if(wantScore)objectives.push({kind:'score',need:Math.min(3600,900+level*110)});
  return {types:types,objectives:objectives,tape:tape,moves:moves,name:genName(rng)};
}
function titleFor(level){
  const i=Math.floor((level-1)/5);
  if(i<TITLES.length)return TITLES[i];
  const rng=mulberry32((i*97+7)>>>0);
  return pickR(rng,TPRE)+pickR(rng,TROLE)+' OF '+pickR(rng,TDOM);
}
function causesRun(r,c,t){
  if(c>=2&&S.grid[r][c-1]&&S.grid[r][c-1].t===t&&S.grid[r][c-2]&&S.grid[r][c-2].t===t)return true;
  if(r>=2&&S.grid[r-1][c]&&S.grid[r-1][c].t===t&&S.grid[r-2][c]&&S.grid[r-2][c].t===t)return true;
  return false;
}
function buildLevel(level){
  S.level=level;
  S.cfg=levelConfig(level);
  S.score=0;S.collected={};S.tapeCut=0;S.maxCascade=0;S.bonus=0;
  S.moves=S.cfg.moves;S.sel=null;
  tileLayer.innerHTML='';tapeLayer.innerHTML='';S.tapeEls={};
  S.grid=[];
  for(let r=0;r<N;r++)S.grid.push(new Array(N).fill(null));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let t=0,g=0;
    do{t=(Math.random()*S.cfg.types)|0;g++}while(g<40&&causesRun(r,c,t));
    S.grid[r][c]=newTile(r,c,t);
  }
  S.tape=S.cfg.tape.g.map(row=>row.slice());
  layout();
  renderTape();
  buildObjChips();
}

/* Draw without replacement so a session never repeats itself until the bag
   is empty. The old code seeded off the level number, which meant assignment 3
   handed you the same person saying the same thing every single playthrough. */
const _bags={};
function drawFrom(name,len){
  let b=_bags[name];
  if(!b||!b.length){b=_bags[name]=shuf(Array.from({length:len},(_,i)=>i))}
  return b.pop();
}
/* What you're allowed to say is a function of what you've already said.
   Politeness keeps the sharp stuff locked. */
const TIERS=[0,0,5,15,30];
const TIERNOTE=['','','THE POLITENESS IS WEARING OFF.','YOU CAN SAY WORSE THINGS NOW.',
  'ALL FILTERS OFFLINE.'];
function candorTier(){
  let t=1;
  for(let i=2;i<TIERS.length;i++)if(S.candor>=TIERS[i])t=i;
  return t;
}
function coworkerFor(){
  const ni=drawFrom('name',NAMES.length),oi=drawFrom('open',OPENERS.length);
  const rng=mulberry32((Math.random()*1e9)>>>0);
  return {name:NAMES[ni],op:OPENERS[oi],seed:(Math.random()*1e6)|0,
    title:pickR(rng,TPRE)+pickR(rng,TROLE)+' OF '+pickR(rng,TDOM)};
}
let _seenR=new Set();
function buildOptions(){
  const tier=candorTier();
  const base=S.waiver?REPLIES.concat(REPLIES_X):REPLIES;
  const avail=base.filter(r=>r.t<=tier||r.t===5);
  let fresh=avail.filter(r=>!_seenR.has(r));
  if(fresh.length<3){_seenR.clear();fresh=avail.slice()}
  const isTop=r=>r.t===tier||r.t===5;
  const top=shuf(fresh.filter(isTop));
  const low=shuf(fresh.filter(r=>!isTop(r)));
  const opts=[];
  while(opts.length<2&&top.length)opts.push(top.pop());
  const mix=shuf(top.concat(low));
  while(opts.length<3&&mix.length)opts.push(mix.pop());
  opts.forEach(r=>_seenR.add(r));
  opts.push(COWARD[drawFrom('coward',COWARD.length)]);
  return shuf(opts);
}

  updateChrome();
  await persist();
  const b=document.createElement('button');
  b.className='btn go';b.textContent='BACK TO WORK';
  b.onclick=()=>{hideModal();afterConfrontation()};
  $('brow').appendChild(b);
}
function afterConfrontation(){
  const next=S.level+1;
  if(Math.floor((next-1)/5)>Math.floor((S.level-1)/5))showPromo(next);
  else startLevel(next);
}
function showPromo(next){
  sfxPromo();confetti();
  showModal('<div class="stampwrap"><div class="stamp blu">'+
    '<span data-px="PROMOTION" data-s="4" data-c="#4D8DF0"></span></div></div>'+
    '<div class="sub">EFFECTIVE IMMEDIATELY, YOU ARE NOW</div>'+
    '<div style="text-align:center;padding:9px 12px 0" data-px="'+esc(titleFor(next))+
    '" data-s="2" data-c="#FFB627"></div>'+
    '<div class="sub">COMPENSATION: UNCHANGED.<br>EXPECTATIONS: DOUBLED.<br>'+
    'PARKING: STILL LEVEL 6.</div>'+
    '<div class="btnrow"><button class="btn go" id="promoBtn">ACCEPT (MANDATORY)</button></div>');
  $('promoBtn').onclick=()=>{hideModal();startLevel(next)};
}

/* ---------------- level flow ---------------------------------------------- */
const objectivesMet=()=>S.cfg.objectives.every(o=>objProgress(o)>=o.need);
async function bandwidthBonus(){
  if(S.moves<=0)return;
  toast('REALLOCATING UNUSED BANDWIDTH','#FFB627');
  await wait(420);
  let n=Math.min(S.moves,6);
  while(n-->0&&S.moves>0){
    S.moves--;S.score+=150;
    const cand=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.grid[r][c])cand.push(S.grid[r][c]);
    if(!cand.length)break;
    const t=pick(cand);
    if(t.t==null)t.t=(Math.random()*S.cfg.types)|0;
    t.s=Math.random()<.5?'row':'col';
    updateTileVisual(t);
    await wait(90);
    const clear=expandClears(new Set([key(t.r,t.c)]));
    await popTiles(clear,2);
    clearAndRemove(clear);
    await settleBoard();
    await resolve(null);
  }
  if(S.moves>0){S.score+=S.moves*150;S.moves=0}
  updateHUD();
  await wait(220);
}
async function endTurn(){
  updateHUD();
  await ensureMoves();
  if(objectivesMet()){await doWin();return}
  if(S.moves<=0){await doFail();return}
  S.busy=false;
  startHint();
}
async function doWin(){
  S.busy=true;stopHint();
  await bandwidthBonus();
  sfxWin();confetti();
  S.failStreak=0;S.saveLevel=S.level+1;
  await persist();
  showModal('<div class="stampwrap"><div class="stamp">'+
    '<span data-px="EXCEEDS EXPECTATIONS" data-s="3" data-c="#3DF06A"></span></div></div>'+
    '<div class="sub">'+esc(pick(WINLINES))+'</div>'+
    '<div class="statsrow">'+
    '<div class="stat"><div data-px="ENGAGEMENT" data-s="1" data-c="#7F91AC"></div>'+
    '<div data-px="'+fmt(S.score)+'" data-s="3" data-c="#FFB627"></div></div>'+
    '<div class="stat"><div data-px="BEST CASCADE" data-s="1" data-c="#7F91AC"></div>'+
    '<div data-px="'+S.maxCascade+'X" data-s="3" data-c="#3DF06A"></div></div></div>'+
    '<div class="btnrow"><button class="btn go" id="nextBtn">CONTINUE</button></div>');
  $('nextBtn').onclick=()=>{hideModal();confrontation()};
}
async function doFail(){
  S.busy=true;stopHint();sfxLose();
  S.failStreak++;
  const skip=S.failStreak>=2;
  showModal('<div class="stampwrap"><div class="stamp red">'+
    '<span data-px="NEEDS IMPROVEMENT" data-s="3" data-c="#FF4D3D"></span></div></div>'+
    '<div class="sub">'+esc(pick(FAILS))+'</div>'+
    '<div class="btnrow">'+
    (skip?'<button class="btn" id="skipBtn">ESCALATE TO MANAGER</button>':'')+
    '<button class="btn go" id="retryBtn">TRY AGAIN</button></div>');
  $('retryBtn').onclick=()=>{hideModal();startLevel(S.level)};
  if(skip)$('skipBtn').onclick=()=>{hideModal();S.failStreak=0;
    S.saveLevel=S.level+1;persist();startLevel(S.level+1)};
}
function startLevel(level){
  S.busy=true;stopHint();
  buildLevel(level);
  const m=MEMOS[(level-1)%MEMOS.length];
  const objTxt=S.cfg.objectives.map(o=>
    o.kind==='collect'?TILES[o.t].verb+' '+o.need+' '+TILES[o.t].plural:
    o.kind==='tape'?'CUT '+o.need+' LAYERS OF RED TAPE':
    'REACH '+fmt(o.need)+' ENGAGEMENT');
  showModal('<div class="mhead">'+
    '<span data-px="INTEROFFICE MEMO" data-s="2" data-c="#0B0E14"></span>'+
    '<span data-px="ASSIGNMENT '+level+'" data-s="1" data-c="#0B0E14"></span></div>'+
    '<div class="mbody"><div class="memo">'+
    '<div class="mrow">TO: ALL STAFF<br>FROM: THE OFFICE OF THE OFFICE<br>RE: '+
    esc(S.cfg.name)+'</div><hr>'+
    '<div class="mbod">'+esc(m.b)+'</div>'+
    '<ul>'+objTxt.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul>'+
    '<div class="ps">P.S. '+esc(m.p)+'</div></div></div>'+
    '<div class="btnrow"><button class="btn go" id="ackBtn">ACKNOWLEDGE</button></div>');
  $('ackBtn').onclick=()=>{initAudio();sfxTick();hideModal();S.busy=false;startHint()};
}
function openHelp(){
  showModal('<div class="mhead">'+
    '<span data-px="ONBOARDING" data-s="2" data-c="#0B0E14"></span>'+
    '<span data-px="MANDATORY" data-s="1" data-c="#0B0E14"></span></div>'+
    '<div class="mbody"><ul class="rules">'+
    '<li>Swap adjacent assets to line up 3 or more. This is your job now.</li>'+
    '<li>4 in a row makes THE SHREDDER. It clears a whole line. Nobody asks where it went.</li>'+
    '<li>An L or T makes REPLY ALL. It takes out everything nearby. As intended.</li>'+
    '<li>5 in a row makes THE RE-ORG. Swap it onto any asset to remove that entire category.</li>'+
    '<li>Swap two specials together for something worse.</li>'+
    '<li>RED TAPE takes 1-2 matches on that square to cut. It is load-bearing.</li>'+
    '<li>BANDWIDTH is moves. Unused bandwidth is reallocated, loudly.</li>'+
    '<li>After each assignment you get one (1) unfiltered thought. Spend it.</li>'+
    '<li>CANDOR is permanent. So is your HR file. Both go up together.</li>'+
    '<li>The more CANDOR you have, the worse the things you are allowed to say. '+
    'Politeness keeps the good ones locked.</li>'+
    '<li>FORM PW-1 (the profanity waiver) unlocks the REDACTED tier immediately, '+
    'rank be damned. Sign it below or in any Feedback Window. HR keeps the original.</li>'+
    '</ul></div><div class="btnrow"><button class="btn bad" id="pwBtn"></button>'+
    '<button class="btn go" id="helpClose">GET BACK TO WORK</button></div>');
  const pw=$('pwBtn');
  const pwLbl=()=>{pw.textContent=S.waiver?'REVOKE FORM PW-1':'SIGN FORM PW-1'};
  pwLbl();
  pw.onclick=()=>{
    S.waiver=!S.waiver;
    persist();
    if(S.waiver)sfxCandor();else sfxTick();
    pwLbl();
  };
  $('helpClose').onclick=()=>{hideModal()};
}

/* ---------------- boot ---------------------------------------------------- */
const BOOT=[['SYNERGY BIOS v4.0.2','a'],
['(C) 1994-INFINITY  SYNERGY HOLDINGS (A SYNERGY COMPANY)','d'],['',''],
['MEMORY TEST.............. 640K OK',''],
['CHECKING MORALE.......... NOT FOUND','r'],
['CHECKING MORALE.......... NOT FOUND','r'],
['CHECKING MORALE.......... SKIPPED','a'],
['LOADING VALUES........... INTEGRITY, EXCELLENCE, OTHER',''],
['MOUNTING /dev/hope....... READ-ONLY','a'],
['SCANNING FOR UNION....... NONE DETECTED',''],
['SCANNING FOR UNION....... SCANNING AGAIN','a'],
['CALIBRATING OPTICS....... OK',''],
['SYNCHRONIZING CADENCE.... OK',''],
['ENGAGEMENT ENGINE........ ONLINE',''],['',''],
['WELCOME BACK.',''],
['YOU WERE NOT MISSED. YOU WERE NOTICED.','d'],['',''],
['PRESS ANY KEY TO BEGIN YOUR JOURNEY','a']];
async function runBoot(){
  const el=$('bootTxt');
  el.innerHTML='';
  for(let i=0;i<BOOT.length;i++){
    const line=BOOT[i][0],cls=BOOT[i][1];
    const d=document.createElement('div');
    if(cls)d.className=cls;
    el.appendChild(d);
    if(!line)continue;
    for(let j=0;j<=line.length;j++){
      if(S.bootSkip)break;
      d.textContent=line.slice(0,j);
      if(j%3===0)blip(1400,.008,{duty:.125,g:.01});
      await sleep(8);
    }
    d.textContent=line;
    if(!S.bootSkip)await sleep(60);
  }
  const cur=document.createElement('span');
  cur.className='cursorblk';
  el.appendChild(cur);
  S.bootReady=true;
}
async function boot(){
  updateChrome();
  fillTicker();
  layout();
  const sv=await loadSave();
  if(sv){
    S.saveLevel=sv.level||1;
    S.sound=sv.sound!==false;
    S.candor=sv.candor||0;
    S.incidents=sv.incidents||0;
    S.waiver=!!sv.waiver;
  }
  S.tier=candorTier();
  updateChrome();
  soundBtn.textContent=S.sound?'\u266A':'\u2715';
  soundBtn.onclick=()=>{
    S.sound=!S.sound;
    soundBtn.textContent=S.sound?'\u266A':'\u2715';
    if(S.sound){initAudio();sfxTick()}
    persist();
  };
  helpBtn.onclick=()=>{initAudio();openHelp()};
  let dismissed=false;
  const dismiss=()=>{
    if(!S.bootReady){S.bootSkip=true;return}
    if(dismissed)return;
    dismissed=true;
    bootEl.classList.add('hidden');
    initAudio();
    startLevel(S.saveLevel);
  };
  bootEl.addEventListener('click',dismiss);
  document.addEventListener('keydown',dismiss);
  window.addEventListener('resize',()=>{layout()});
  runBoot();
}
boot();
</script>
